# product.conf — the DragonFly example (ExampleBSD, DragonFly flavour).
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# This is the exact output format of wtfbsd/agents scripts/apply-answers.sh
# (flat KEY=value, one outer pair of single quotes around each value, then
# the per-OS honesty trailer). It is kept here as a fixture so that this
# template can be tested without the answers repo being present.
#
# The values come from the DragonFly example answers
# (DISTRO_OS=dragonfly, FILESYSTEM_ROOT=hammer2, ZFS_DATA_POOL=no,
# PROFILE=appliance). The brand URL and the publish target are the
# example.org placeholder this template requires; they are plain data to
# the build and are not used for anything else.
#
DISTRO_OS='dragonfly'
DISTRO_NAME='ExampleBSD'
DISTRO_SLUG='examplebsd'
DISTRO_ARCH='amd64'
FILESYSTEM_ROOT='hammer2'
ZFS_DATA_POOL='no'
# ZFS_POOL_NAME is empty because ZFS_DATA_POOL is not "yes"
ZFS_POOL_NAME=''
PROFILE='appliance'
PACKAGE_SET='base-server'
INSTALLER='tui'
MOTD='ExampleBSD - a small DragonFly distribution'
BRAND_COLOR='2e7d66'
BRAND_URL='https://example.org'
CI_ENABLED='yes'
PUBLISH_METHOD='api'
PUBLISH_TARGET='example.org'
PUBLISHER_ORG='wtfbsd'
#
# honest per-OS row used for this build (from questions.yaml):
#   DISTRO_OS  dragonfly
#   arch       amd64
#   root_fs    hammer2 ufs
#   installer  tui
#   zfs_pool   no
