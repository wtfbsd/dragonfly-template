#
# This fixture models nrelease/gui/etc/rc.conf of the upstream nrelease
# of DragonFly: the rc.conf of the LIVE media of the GUI build.
#
# rc.conf for live usb stick boot
#
hostname="dfly-live"
kern_securelevel_enable="NO"
nfs_reserved_port_only="YES"
sshd_enable="YES"
syslogd_enable="NO"
nfs_client_enable="YES"
nfs_server_enable="NO"
rpc_umntall_enable="NO"
cron_enable="NO"
moused_enable="NO"
