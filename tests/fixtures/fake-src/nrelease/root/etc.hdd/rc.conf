# rc.conf of the installed system (the etc.hdd tree of the release root).
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# This fixture models nrelease/root/etc.hdd/rc.conf of the upstream
# nrelease of DragonFly: the installer copies etc.hdd in place of etc,
# so this file is the rc.conf of the INSTALLED system. It holds no
# root_rw_mount: the root of an installed system is writable.
#
# Basic rc.conf, adjust according to your needs
#
sshd_enable="YES"
dntpd_enable="YES"
nfs_client_enable="YES"
nfs_reserved_port_only="YES"
rpc_umntall_enable="NO"
