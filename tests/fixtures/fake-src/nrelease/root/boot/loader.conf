# boot/loader.conf of the skeleton of the release root.
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# This fixture models nrelease/root/boot/loader.conf of the upstream
# nrelease of DragonFly: the kernel_options line is the one the live
# media boots with, and the vfs.root.mountfrom line is the one mkimg
# rewrites for the disk image. The template appends its own console line
# and never replaces this file.
#
# ISO/IMG boot
#
kernel_options="-C"	# (ISO-only) boot from CDROM
#vfs.root.mountfrom="ROOT"	# (IMG-only)
dm_load="YES"
