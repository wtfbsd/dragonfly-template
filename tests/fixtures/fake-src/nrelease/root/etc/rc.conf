# rc.conf of the skeleton of the release root.
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# This fixture models nrelease/root/etc/rc.conf of the upstream nrelease
# of DragonFly: the rc.conf of the LIVE media, whose root is read-only.
#
# rc.conf for ISO/IMG boot.
#
nfs_reserved_port_only="YES"
nfs_client_enable="YES"
rpc_umntall_enable="NO"
cron_enable="NO"
root_rw_mount="NO"	# (ISO-only) Don't remount readonly root to be rw.
