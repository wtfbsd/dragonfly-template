# /usr/local/etc/doas.conf — the privilege escalation of the product.
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# The first-boot user is put into the wheel group by
# /etc/rc.d/firstboot_user, and every member of wheel may become root
# with doas(1). The password of the account is asked for.
#
# This file is the configuration of doas(1); it is never written by the
# build: the build copies the overlay over the release root.
#
permit persist :wheel
