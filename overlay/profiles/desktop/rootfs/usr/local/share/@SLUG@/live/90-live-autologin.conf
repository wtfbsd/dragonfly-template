# 90-live-autologin.conf — the automatic login of the LIVE media.
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# /etc/rc.d/live_session copies this file into
# /usr/local/etc/lightdm/lightdm.conf.d/ on the live media only, after it
# has created the live user. The installer removes it from the installed
# system (@SLUG@-live-clean): the installed system shows the greeter.
[Seat:*]
autologin-user=live
autologin-user-timeout=0
autologin-session=xfce
