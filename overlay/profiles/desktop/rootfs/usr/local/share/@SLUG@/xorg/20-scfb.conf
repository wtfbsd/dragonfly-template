#
# The X fallback for a console display that has no KMS driver: a bhyve
# guest (or any seat without /dev/dri/card0) has no DRM device, so Xorg
# exits "Cannot run in framebuffer mode. Please specify busIDs" and the
# greeter shows a blank screen. This Device section pins the console
# display to the scfb (software framebuffer) driver. It ships under the
# product name so that the first-boot script installs it only on the
# seats that need it (see firstboot_user).

Section "Device"
	Identifier "Console display"
	Driver     "scfb"
EndSection