# 50-examplebsd.conf — LightDM configuration for the desktop profile.
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# X11 only: the greeter is lightdm-gtk-greeter and the session is Xfce.
# There is no Wayland anywhere in this distribution.
#
# The greeter and the session of the seat are set under [Seat:*]: that
# is where LightDM reads them from. The directory keys of the greeter
# (Directory=, sessions-directory=) are no keys of LightDM, so they are
# not here.
#
# DPorts installs its LightDM configuration under the DPorts prefix
# (/usr/local).

[LightDM]
greeter-hide-users=false

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
